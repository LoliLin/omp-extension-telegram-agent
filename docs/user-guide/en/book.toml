[book]
title = "Pi Telegram Agent user guide"
authors = ["pi-extension-telegram-agent maintainers"]
description = "Configure, use, and maintain Pi-native Telegram group agents"
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
site-url = "/pi-extension-telegram-agent/en/"
git-repository-url = "https://github.com/mizorewww/pi-extension-telegram-agent"
edit-url-template = "https://github.com/mizorewww/pi-extension-telegram-agent/edit/main/docs/user-guide/en/{path}"

[output.html.search]
enable = true
